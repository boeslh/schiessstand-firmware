[env:esp32dev]
; pioarduino-Fork statt offizieller PlatformIO-Plattform, da diese noch auf
; Arduino-ESP32 Core 2.x haengt.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32dev
framework = arduino
; ACHTUNG: lib_extra_dirs bewusst NICHT auf ~/Documents/Arduino/libraries
; gesetzt - dort liegt eine alte "WiFi"-Lib (v1.2.7, Arduino-WiFi-Shield,
; architectures=*). Die ueberdeckt sonst per LDF die ESP32-Core-WiFi.h und
; WiFiClass verliert mode()/setAutoReconnect()/setSleep() etc. Dieser
; Sketch braucht keine der dortigen Libraries